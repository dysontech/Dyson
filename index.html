<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DYSON — Connect without limits</title>
  <meta name="description" content="DYSON: chats, calls, communities, status, live streams, events, business tools and an encrypted vault.">
  <meta name="theme-color" content="#050b1f">
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="views.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="core.js"></script>
</head>
<body class="welcome-body">
  <div class="welcome">
    <div class="w-globe" aria-hidden="true"><span></span></div>
    <header class="w-top"><a class="brand" href="index.html"><img src="icon.png" alt="" width="40" height="40"><span><b>DYSON</b><small>Connect without limits.</small></span></a>
      <nav><a href="features.html">Features</a><a href="help.html">Help</a><a class="btn btn-sm btn-outline btn-pill" href="start.html">Sign in</a></nav></header>
    <main class="w-main">
      <img class="w-logo" src="icon.png" alt="DYSON" width="132" height="132">
      <h1>DYSON</h1>
      <p class="tag1">Connect without limits.</p>
      <p class="tag2">Message • Connect • Share • Grow</p>
      <div class="w-dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
      <div class="w-cta">
        <a class="btn btn-primary btn-pill btn-block" id="getStarted" href="start.html?mode=signup">Get Started <svg class="ic"><use href="icons.svg#i-chevron-right"/></svg></a>
        <a class="btn btn-outline btn-pill btn-block" href="start.html">Sign In</a>
        <a class="btn btn-pill btn-block google" id="gBtn" href="start.html?mode=signup"><span class="g"><svg class="ic"><use href="icons.svg#i-google"/></svg></span> Continue with Google</a>
      </div>
      <ul class="w-feats" aria-label="Features">
        <li><svg class="ic"><use href="icons.svg#i-chat"/></svg>Chat</li><li><svg class="ic"><use href="icons.svg#i-status"/></svg>Status</li><li><svg class="ic"><use href="icons.svg#i-users"/></svg>Communities</li><li><svg class="ic"><use href="icons.svg#i-live"/></svg>Live</li>
        <li><svg class="ic"><use href="icons.svg#i-spark"/></svg>AI Assistant</li><li><svg class="ic"><use href="icons.svg#i-briefcase"/></svg>Business</li><li><svg class="ic"><use href="icons.svg#i-calendar"/></svg>Events</li><li><svg class="ic"><use href="icons.svg#i-cloud"/></svg>Vault</li>
      </ul>
    </main>
    <footer class="w-foot"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="help.html">Help</a><span>© DYSON</span></footer>
  </div>
  <script>
    // Signed-in visitors go straight to the app
    (async () => { if (!D.configured) return; try { const { data: { session } } = await D.sb.auth.getSession(); if (session) location.replace('app.html'); } catch (e) {} })();
  </script>
</body>
</html>
